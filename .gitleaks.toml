# Se mantienen todas las reglas por defecto y solo se añade una excepción muy acotada.
[extend]
useDefault = true

[allowlist]
description = "En render.yaml (y al citarlo en la documentación) los NOMBRES de variables van tras 'key:', y la regla generic-api-key los toma por secretos. Solo se permiten nombres en mayúsculas: cualquier valor real se sigue detectando."
regexTarget = "match"
regexes = ['''key:\s*[A-Z][A-Z0-9_]{2,}''']
