# Despliegue gratuito en Render. Un solo servicio web sirve la app, la cola y el planificador
# (docker/render/start.sh): el plan gratuito no incluye trabajadores en segundo plano.
# La base y los archivos viven en Supabase, porque el disco de Render es efímero.
services:
    - type: web
      name: reformas-leads
      runtime: docker
      plan: free
      region: oregon
      dockerfilePath: ./Dockerfile
      dockerCommand: ./docker/render/start.sh
      healthCheckPath: /health
      envVars:
          - key: APP_NAME
            value: Reformas Leads
          # Cuenta del administrador: se crea al arrancar. El registro público está cerrado en producción.
          - key: ADMIN_EMAIL
            sync: false
          - key: ADMIN_PASSWORD
            sync: false
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: APP_KEY
            sync: false
          - key: APP_URL
            sync: false
          - key: DB_CONNECTION
            value: pgsql
          - key: DB_HOST
            sync: false
          - key: DB_PORT
            value: '5432'
          - key: DB_DATABASE
            sync: false
          - key: DB_USERNAME
            sync: false
          - key: DB_PASSWORD
            sync: false
          - key: DB_SSLMODE
            value: require
          - key: QUEUE_CONNECTION
            value: database
          - key: SESSION_DRIVER
            value: database
          - key: CACHE_STORE
            value: database
          # Los archivos van a Supabase Storage: en Render se perderían en cada reinicio.
          - key: ATTACHMENTS_DISK
            value: s3
          - key: AWS_ACCESS_KEY_ID
            sync: false
          - key: AWS_SECRET_ACCESS_KEY
            sync: false
          - key: AWS_DEFAULT_REGION
            sync: false
          - key: AWS_BUCKET
            sync: false
          - key: AWS_ENDPOINT
            sync: false
          - key: AWS_USE_PATH_STYLE_ENDPOINT
            value: 'true'
          - key: GEMINI_API_KEY
            sync: false
          # URL COMPLETA, con https://. Se pone a mano con la que Render dé a reformas-n8n.
          # No usar `fromService` con `hostport`: devuelve "host:puerto" sin esquema, y el
          # código la usa tal cual (`base_url.'/healthz'`), así que la comprobación falla
          # siempre y el panel marca n8n como caído aunque esté vivo.
          - key: N8N_BASE_URL
            sync: false
          - key: DELIVERY_CRM_URL
            sync: false
          - key: DELIVERY_TEAM_URL
            sync: false
          - key: DELIVERY_CUSTOMER_URL
            sync: false
          - key: TELEGRAM_BOT_USERNAME
            sync: false
          - key: BOT_API_KEY
            sync: false
          - key: FAKE_CRM_URL
            sync: false
          - key: FAKE_CRM_TOKEN
            sync: false

    - type: web
      name: reformas-n8n
      runtime: image
      plan: free
      region: oregon
      image:
          url: docker.io/n8nio/n8n:2.38.7
      envVars:
          # Sin esto, n8n guardaría flujos y credenciales en un disco que Render borra al reiniciar.
          - key: DB_TYPE
            value: postgresdb
          - key: DB_POSTGRESDB_HOST
            sync: false
          - key: DB_POSTGRESDB_PORT
            value: '5432'
          - key: DB_POSTGRESDB_DATABASE
            sync: false
          - key: DB_POSTGRESDB_USER
            sync: false
          - key: DB_POSTGRESDB_PASSWORD
            sync: false
          - key: DB_POSTGRESDB_SCHEMA
            value: n8n
          # Supabase exige TLS: sin habilitarlo, la conexión se queda colgada hasta agotar el tiempo.
          - key: DB_POSTGRESDB_SSL_ENABLED
            value: 'true'
          - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
            value: 'false'
          # Si cambia, las credenciales guardadas dejan de poder leerse.
          - key: N8N_ENCRYPTION_KEY
            sync: false
          - key: N8N_HOST
            sync: false
          - key: N8N_PROTOCOL
            value: https
          - key: WEBHOOK_URL
            sync: false
          - key: N8N_PORT
            value: '10000'
          # El plan gratuito da 512 MB. Medido con el contenedor capado de verdad
          # (docker run --memory=512m), n8n 2.38.7 cabe si se le quitan dos cosas.
          #
          # 1) n8n 2.x arranca por defecto un SEGUNDO proceso de Node para ejecutar
          #    tareas (JS Task Runner + su broker). Dos runtimes no caben en 512 MB:
          #    el núcleo mata el contenedor a los 27 s. Sin él, el código se ejecuta
          #    en el proceso principal, como en n8n 1.x. Nuestro flujo no usa nodos
          #    Code, así que no perdemos nada.
          - key: N8N_RUNNERS_ENABLED
            value: 'false'
          # 2) Servir el editor es lo que revienta el contenedor: con el montón alto
          #    lo mata el núcleo por memoria residente, con el montón bajo se ahoga V8.
          #    Aquí n8n solo EJECUTA; se edita desde un n8n local apuntando a esta
          #    misma base de Supabase, que es la separación que recomienda n8n.
          - key: N8N_DISABLE_UI
            value: 'true'
          # Con lo anterior se queda plano en ~300 MB. Un tope de montón por debajo
          # del límite del contenedor deja margen para la memoria que no es montón.
          # Ojo: 256 es PEOR que no poner nada, ahoga a V8 y muere con salida 134.
          - key: NODE_OPTIONS
            value: '--max-old-space-size=320'
          # Una ejecución a la vez y cargas pequeñas: los avisos son texto, no archivos.
          - key: N8N_CONCURRENCY_PRODUCTION_LIMIT
            value: '2'
          - key: N8N_PAYLOAD_SIZE_MAX
            value: '4'
          - key: N8N_TEMPLATES_ENABLED
            value: 'false'
          - key: N8N_VERSION_NOTIFICATIONS_ENABLED
            value: 'false'
          - key: N8N_PERSONALIZATION_ENABLED
            value: 'false'
          - key: N8N_HIRING_BANNER_ENABLED
            value: 'false'
          # Menos conexiones al pooler de Supabase y menos historial guardado.
          - key: DB_POSTGRESDB_POOL_SIZE
            value: '2'
          - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
            value: 'none'
          - key: EXECUTIONS_DATA_PRUNE
            value: 'true'
          - key: EXECUTIONS_DATA_MAX_AGE
            value: '72'
          - key: GENERIC_TIMEZONE
            value: Europe/Madrid
          - key: N8N_DIAGNOSTICS_ENABLED
            value: 'false'

    - type: web
      name: reformas-fake-crm
      runtime: node
      plan: free
      region: oregon
      rootDir: docker/fake-crm
      buildCommand: echo "sin dependencias"
      startCommand: node server.mjs
      healthCheckPath: /health
      envVars:
          - key: NODE_VERSION
            value: '22'
          - key: FAKE_CRM_TOKEN
            sync: false
