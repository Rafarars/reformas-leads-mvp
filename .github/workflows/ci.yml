name: CI

on:
    push:
        branches: [main]
    pull_request:

# Un push nuevo cancela la corrida anterior de la misma rama.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    secrets:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Historial completo: un secreto filtrado hace 20 commits sigue filtrado.
                  fetch-depth: 0
                  persist-credentials: false

            - name: gitleaks
              run: |
                  docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
                    detect --source=/repo --redact --verbose

    quality:
        name: Lint, types and tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: npm

            - run: composer install --no-interaction --prefer-dist --no-progress
            - run: npm ci

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            # Pint, PHPStan y Pest. Las pruebas usan SQLite en memoria: no hace falta Postgres.
            - run: composer test
            # Regenera los tipos de rutas de Wayfinder antes de tsc: en un clon limpio no existen.
            - run: npm run types:check
            - run: npm run check

    e2e:
        name: End-to-end tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
                  cache: npm

            - run: composer install --no-interaction --prefer-dist --no-progress
            - run: npm ci

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  # Clave desechable: el runner nace y muere con esta corrida.
                  sed -i "s/^N8N_ENCRYPTION_KEY=.*/N8N_ENCRYPTION_KEY=$(openssl rand -hex 32)/" .env
                  # El runner no usa el UID 1000: sin esto el contenedor no puede escribir en el código montado.
                  printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" >> .env

            # El contenedor de desarrollo sirve public/build desde el código montado.
            - run: npm run build

            # El mismo compose que se usa en local: si funciona allí, funciona aquí.
            - name: Start services
              run: docker compose up -d --build --wait --wait-timeout 300

            - run: docker compose exec -T app php artisan migrate --force

            # Los binarios solo cambian al subir de versión de Playwright.
            - uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            # `--with-deps` instala librerías con apt y depende de repos externos: falla de forma
            # transitoria. Se reintenta en vez de tumbar el CI.
            - name: Install Playwright browsers
              run: |
                  for attempt in 1 2 3; do
                    if npx playwright install --with-deps chromium; then
                      exit 0
                    fi
                    echo "Intento $attempt fallido; reintentando en 15s"
                    sleep 15
                  done
                  exit 1

            - run: npm run test:e2e

            - name: Docker logs
              if: failure()
              run: docker compose logs --no-color > docker-logs.txt

            - uses: actions/upload-artifact@v7
              if: always() && hashFiles('playwright-report/index.html') != ''
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 14

            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: docker-logs
                  path: docker-logs.txt
                  retention-days: 7
