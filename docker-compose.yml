# Los tres servicios comparten la red del compose y se hablan por nombre: app, db, n8n.
# Compose lee el mismo .env que Laravel: las credenciales tienen una sola fuente.
name: reformas-leads

x-app-env: &app-env
    # Dentro de la red del compose la base es "db" en su puerto interno, no 127.0.0.1:5433.
    # Las variables de entorno reales tienen prioridad sobre el .env que Laravel lee.
    DB_HOST: db
    DB_PORT: 5432
    N8N_BASE_URL: http://n8n:5678

services:
    app:
        build:
            context: .
            target: dev
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        image: reformas-leads-app:dev
        container_name: reformas-app
        restart: unless-stopped
        environment: *app-env
        ports:
            - '${BIND_HOST:-127.0.0.1}:${APP_PORT:-8010}:8010'
        volumes:
            - .:/app
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - php
                - -r
                - "exit(@file_get_contents('http://localhost:8010/health') === false ? 1 : 0);"
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 10s

    queue:
        image: reformas-leads-app:dev
        container_name: reformas-queue
        restart: unless-stopped
        # listen y no work: recarga el código en cada job, que es lo que se quiere al desarrollar.
        command: ['php', 'artisan', 'queue:listen', '--tries=1', '--timeout=0']
        environment: *app-env
        volumes:
            - .:/app
        depends_on:
            app:
                condition: service_healthy

    db:
        image: postgres:17-alpine
        container_name: reformas-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USERNAME:-reformas}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-reformas}
            POSTGRES_DB: ${DB_DATABASE:-reformas}
        ports:
            - '${BIND_HOST:-127.0.0.1}:${DB_PORT:-5433}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U ${DB_USERNAME:-reformas} -d ${DB_DATABASE:-reformas}
            interval: 5s
            timeout: 5s
            retries: 10

    n8n:
        image: n8nio/n8n:2.38.7
        container_name: reformas-n8n
        restart: unless-stopped
        environment:
            # Sin valor por defecto a proposito: cifra las credenciales guardadas en n8n.
            # Si cambia, las credenciales existentes dejan de poder leerse.
            N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?falta N8N_ENCRYPTION_KEY en .env}
            N8N_PORT: 5678
            WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
            GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Europe/Madrid}
            TZ: ${N8N_TIMEZONE:-Europe/Madrid}
            N8N_DIAGNOSTICS_ENABLED: 'false'
        ports:
            - '${BIND_HOST:-127.0.0.1}:${N8N_PORT:-5678}:5678'
        volumes:
            - n8n_data:/home/node/.n8n
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://localhost:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

volumes:
    pgdata:
    n8n_data:
